<section class="appointment-management-layout">

  <!-- Sección del formulario para registrar una nueva cita -->
  <div class="appointment-form-section">
    <h2>{{ 'appointments.register' | translate }}</h2>
    <form (ngSubmit)="createAppointment()" novalidate>
      <div class="form-group">
        <label for="date">{{ 'appointments.form.date' | translate }}</label>
        <input id="date" type="date" [(ngModel)]="newAppointment.date" name="date" required />
      </div>

      <div class="form-group">
        <label for="time">{{ 'appointments.form.time' | translate }}</label>
        <input id="time" type="text" [(ngModel)]="newAppointment.time" name="time" required />
      </div>

      <div class="form-group">
        <label for="residentId">{{ 'appointments.form.resident' | translate }}</label>
        <input
          id="residentId"
          type="number"
          [(ngModel)]="newAppointment.residentId"
          name="residentId"
          required
          min="1"
        />
      </div>

      <div class="form-group">
        <label for="doctorId">{{ 'appointments.form.doctor' | translate }}</label>
        <input
          id="doctorId"
          type="number"
          [(ngModel)]="newAppointment.doctorId"
          name="doctorId"
          required
          min="1"
        />
      </div>

      <button type="submit" class="btn btn-primary">
        {{ 'appointments.create' | translate }}
      </button>
    </form>
  </div>


  <!-- Sección que muestra la lista de citas existentes -->
  <div class="appointment-list-section">
    <h2>{{ 'appointments.list' | translate }}</h2>

    <div class="search-section">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        placeholder="{{ 'appointments.search' | translate }}"
        class="search-input"
      />
    </div>

    <app-list-appointments
      [appointments]="filteredAppointments"
      [searchQuery]="searchQuery"
      (delete)="confirmDelete($event)"
      (updateStatus)="requestStatusChange($event)">
    </app-list-appointments>
  </div>

  <!-- Modal de confirmación para eliminar cita -->
  <div *ngIf="showConfirmDeleteId !== null" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>{{ 'appointments.confirmDelete' | translate }}</p>
      <div class="modal-actions">
        <button (click)="deleteAppointment(showConfirmDeleteId!)" class="btn btn-danger">
          {{ 'appointments.delete' | translate }}
        </button>
        <button (click)="cancelDelete()" class="btn btn-secondary">
          {{ 'appointments.cancel' | translate }}
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación para cambio de estado -->
  <div *ngIf="pendingStatusChange" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>
        {{ 'appointments.confirmStatusChange' | translate }} "{{ pendingStatusChange.status }}"?
      </p>
      <div class="modal-actions">
        <button (click)="confirmStatusChange()" class="btn btn-primary">
          {{ 'appointments.confirm' | translate }}
        </button>
        <button (click)="cancelStatusChange()" class="btn btn-secondary">
          {{ 'appointments.cancel' | translate }}
        </button>
      </div>
    </div>
  </div>

</section>
