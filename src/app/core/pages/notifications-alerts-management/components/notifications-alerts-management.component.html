<section class="notifications-management-layout">
  <div *ngIf="view !== 'family'" class="notifications-add-section">
    <h2 class="notifications-title">Crear Nueva Notificación</h2>
    <app-notification-management (createNotification)="onCreateNotification($event)"></app-notification-management>
  </div>
  <div *ngIf="view !== 'management'" class="notifications-list-section">
    <h2 class="notifications-title">Notificaciones</h2>
    <div class="notification-filters">
      <button class="notification-action-btn" (click)="setFilter('all')" [class.active]="filter === 'all'">Todas</button>
      <button class="notification-action-btn" (click)="setFilter('unread')" [class.active]="filter === 'unread'">No leídas</button>
      <button class="notification-action-btn" (click)="setFilter('read')" [class.active]="filter === 'read'">Leídas</button>
      <button class="notification-action-btn" (click)="setFilter('archived')" [class.active]="filter === 'archived'">Archivadas</button>
    </div>
    <app-notifications-list
      [notifications]="notifications"
      (deleteConfirmed)="confirmDelete($event)"
      (updateStatus)="onUpdateStatus($event)">
    </app-notifications-list>
  </div>
  <div *ngIf="showSuccessModal" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>¡Notificación creada exitosamente!</p>
      <button (click)="closeSuccessModal()">Cerrar</button>
    </div>
  </div>
</section>
