<section class="notifications-management-layout">
  <div *ngIf="view !== 'family'" class="notifications-add-section">
    <h2 class="notifications-title">{{ 'notifications.form.create' | translate }}</h2>
    <app-notification-management (createNotification)="onCreateNotification($event)"></app-notification-management>
  </div>
  <div *ngIf="view !== 'management'" class="notifications-list-section">
    <h2 class="notifications-title">{{ 'notifications.notifications' | translate }}</h2>
    <div class="notification-filters">
      <button class="notification-action-btn" (click)="setFilter('all')" [class.active]="filter === 'all'">{{ 'notifications.filters.all' | translate }}</button>
      <button class="notification-action-btn" (click)="setFilter('unread')" [class.active]="filter === 'unread'">{{ 'notifications.filters.unread' | translate }}</button>
      <button class="notification-action-btn" (click)="setFilter('read')" [class.active]="filter === 'read'">{{ 'notifications.statusValue.read' | translate }}</button>
      <button class="notification-action-btn" (click)="setFilter('archived')" [class.active]="filter === 'archived'">{{ 'notifications.filters.archived' | translate }}</button>
    </div>
    <app-notifications-list
      [notifications]="notifications"
      (deleteConfirmed)="confirmDelete($event)"
      (updateStatus)="onUpdateStatus($event)">
    </app-notifications-list>
  </div>
  <div *ngIf="showSuccessModal" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>{{ 'notifications.notificationCreatedSuccess' | translate }}</p>
      <button (click)="closeSuccessModal()">{{ 'notifications.close' | translate }}</button>
    </div>
  </div>
</section>
